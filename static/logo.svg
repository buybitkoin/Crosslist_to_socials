<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" filter="url(#shadow)"/>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Hanger shape — represents clothing/fashion -->
  <g transform="translate(256,220)">
    <!-- Hook -->
    <path d="M0,-75 Q20,-95 20,-75 Q20,-55 0,-55" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M0,-55 L-90,15" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>
    <path d="M0,-55 L90,15" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>
    <!-- Bottom bar -->
    <path d="M-90,15 L90,15" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Share/network nodes — represents social media -->
  <!-- Center node -->
  <circle cx="256" cy="310" r="16" fill="white"/>

  <!-- Left node -->
  <circle cx="175" cy="355" r="12" fill="rgba(255,255,255,0.9)"/>
  <line x1="244" y1="318" x2="185" y2="348" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round"/>

  <!-- Right node -->
  <circle cx="337" cy="355" r="12" fill="rgba(255,255,255,0.9)"/>
  <line x1="268" y1="318" x2="327" y2="348" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round"/>

  <!-- Bottom node -->
  <circle cx="256" cy="395" r="12" fill="rgba(255,255,255,0.9)"/>
  <line x1="256" y1="326" x2="256" y2="383" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round"/>

  <!-- Sparkle accents -->
  <g fill="rgba(255,255,255,0.7)">
    <circle cx="155" cy="170" r="4"/>
    <circle cx="370" cy="155" r="3"/>
    <circle cx="130" cy="280" r="3"/>
    <circle cx="385" cy="290" r="4"/>
    <circle cx="340" cy="430" r="3"/>
    <circle cx="170" cy="420" r="3"/>
  </g>

  <!-- Lightning bolt — represents automation/AI -->
  <g transform="translate(340,140) scale(0.7)">
    <polygon points="20,0 0,35 15,35 8,60 40,22 22,22 32,0" fill="rgba(255,255,255,0.85)"/>
  </g>
</svg>
