<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crosslist To Socials</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { text-align: center; max-width: 500px; }
        .logo { width: 80px; height: 80px; margin-bottom: 24px; }
        h1 { font-size: 1.8rem; margin-bottom: 8px; background: linear-gradient(135deg, #6366f1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #a0a0a0; font-size: 1rem; margin-bottom: 24px; line-height: 1.6; }
        .links a { color: #60a5fa; text-decoration: none; font-size: 0.9rem; margin: 0 12px; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://raw.githubusercontent.com/nickandolino/SocialMediaAgent/master/static/logo.svg" alt="Logo" class="logo" onerror="this.style.display='none'">
        <h1>Crosslist To Socials</h1>
        <p>Automate your clothing resale social media posts. Scrape listings, generate captions, and publish to Pinterest and Instagram.</p>
        <div class="links">
            <a href="/privacy-policy.html">Privacy Policy</a>
        </div>
    </div>
</body>
</html>
